name: Security Scan

on:
  push:
    branches: [ main, initial-setup, develop ]
  pull_request:
    branches: [ main, initial-setup, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for secret detection
                
      - name: Check for hardcoded credentials
        run: |
          echo "🔍 Checking for hardcoded credentials (PHP only)..."

          EXCLUDES="--exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github"

          # Database secrets
          if grep -R $EXCLUDES --include="*.php" -nE \
            "(DB_PASSWORD|DATABASE_PASSWORD|MYSQL_PASSWORD)[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" .; then
            echo "❌ Hardcoded DB password found"
            exit 1
          fi

         

          echo "✅ No hardcoded credentials found"

      - name: Check for sensitive patterns in comments
        run: |
          echo "🔍 Checking for sensitive information in comments..."
          
          # Look for domains in comments that might leak information
          if grep -r "//.*crystalhansenartographic\|#.*crystalhansenartographic" . --include="*.php" | grep -v ".github"; then
            echo "⚠️  WARNING: Found domain references in comments (consider removing)"
          fi
          
          echo "✅ Comment scan complete"

      - name: Check .gitignore configuration
        run: |
          echo "🔍 Checking .gitignore for sensitive files..."
          
          if [ -f .gitignore ]; then
            if grep -q "\.env" .gitignore && \
               grep -q "config\.php" .gitignore && \
               grep -q "\.log" .gitignore; then
              echo "✅ .gitignore properly configured"
            else
              echo "⚠️  WARNING: .gitignore may be missing important entries"
              echo "   Recommended entries:"
              echo "   - .env (and .env.local)"
              echo "   - inc/config.php"
              echo "   - *.log"
            fi
          else
            echo "❌ ERROR: .gitignore not found"
            exit 1
          fi

      - name: Verify environment variables are used
        run: |
          echo "🔍 Verifying environment variables are used for sensitive config..."
          
          # Check mail.php uses getenv for credentials
          if grep -q "getenv.*MAIL_PASSWORD" mail.php; then
            echo "✅ Mail configuration uses environment variables"
          else
            echo "⚠️  WARNING: mail.php may not use environment variables for credentials"
          fi
          
          # Check BaseController uses getenv for reCAPTCHA
          if grep -q "getenv.*RECAPTCHA" controller/BaseController.php; then
            echo "✅ reCAPTCHA configuration uses environment variables"
          else
            echo "⚠️  WARNING: reCAPTCHA may not use environment variables"
          fi

      - name: Generate security report
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Hardcoded credentials check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sensitive patterns check" >> $GITHUB_STEP_SUMMARY
          echo "✅ .gitignore validation" >> $GITHUB_STEP_SUMMARY
          echo "✅ Environment variables check" >> $GITHUB_STEP_SUMMARY

